<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>은영 포스기 연습</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #c8c8c8;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }

  #loadingOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.96);
    z-index: 999999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  #loadingOverlay .loading-title { font-size: 18px; font-weight: bold; color: #cc0000; }
  #loadingOverlay .loading-sub { font-size: 12px; color: #999; }

  .topbar {
    background: #f0f0f0;
    border-bottom: 2px solid #999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    flex-shrink: 0;
  }
  .topbar-left { display: flex; gap: 6px; }
  .btn-quiz-toggle {
    padding: 5px 14px; border: none; background: #ffd700;
    color: #333; font-size: 12px; font-weight: bold; cursor: pointer; border-radius: 3px;
  }
  .btn-export-data {
    padding: 5px 10px; border: 1px solid #555; background: #4caf50;
    color: white; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 3px;
  }
  .btn-export-data:active { background: #388e3c; }

  .quiz-score { font-weight: bold; color: #cc0000; font-size: 12px; align-self: center; }

  .quiz-prompt {
    background: #fff8dc; border-top: 2px solid #ffd700;
    padding: 8px 12px; font-size: 13px; font-weight: bold; color: #333;
    flex-shrink: 0; display: none;
  }
  .quiz-prompt.show { display: block; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #c8c8c8; }

  .cat-area { background: #d0d0d0; padding: 4px 4px 0; flex-shrink: 0; }
  .cat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; margin-bottom: 3px; }

  .cat-btn {
    position: relative; padding: 5px 3px; border: 1px solid #bbb;
    background: #e6e6e6; font-size: 3.6vw; cursor: pointer; border-radius: 2px;
    text-align: center; line-height: 1.3; min-height: 34px;
    display: flex; align-items: center; justify-content: center; word-break: keep-all;
    overflow: hidden;
  }
  .cat-btn.active { background: white; border: 2px solid #cc0000; font-weight: bold; }
  .cat-btn:active { background: #cce0ff; }
  .cat-btn.empty { background: #e6e6e6; border: 1px solid #bbb; cursor: default; pointer-events: none; }
  .cat-nav {
    background: #888; color: white; font-size: 16px; cursor: pointer;
    border: 1px solid #666; border-radius: 2px;
    display: flex; align-items: center; justify-content: center; min-height: 34px;
  }
  .cat-nav:active { background: #555; }

  .red-divider { height: 3px; background: #cc0000; margin: 0 4px 3px; flex-shrink: 0; }

  .menu-area { flex: 1; padding: 0 4px 4px; overflow: hidden; }
  .menu-grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(6, 1fr); gap: 3px; height: 100%;
  }

  .menu-btn {
    position: relative; background: white; border: 1px solid #c0c0c0;
    padding: 2px 1px; font-size: 3.6vw; cursor: pointer; border-radius: 2px;
    text-align: center; line-height: 1.25; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; word-break: keep-all; overflow: hidden;
  }
  .menu-btn.blank { background: white; border: 1px solid #c0c0c0; }
  .menu-btn:active { background: #cce0ff; border-color: #66a; }
  .menu-btn .price { color: #555; font-size: 2.8vw; }
  .menu-btn.flash-correct { background: #4caf50 !important; color: white; }
  .menu-btn.flash-wrong   { background: #f44336 !important; color: white; }
  .menu-btn.flash { background: #ffe0b0 !important; border-color: #ff8800 !important; }

  .menu-btn.pressing,
  .cat-btn.pressing {
    background: #fff3e0 !important;
    border: 2px solid #ff8800 !important;
    animation: press-fill 0.6s linear forwards;
  }
  @keyframes press-fill {
    0%   { box-shadow: inset 0 0 0 0px rgba(255,136,0,0.15); }
    100% { box-shadow: inset 0 0 0 40px rgba(255,136,0,0.15); }
  }

  .edit-modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); z-index: 99999;
    align-items: center; justify-content: center;
  }
  .edit-modal.show { display: flex; }
  .modal-content {
    background: white; padding: 20px; border-radius: 8px;
    width: 85%; max-width: 320px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .modal-title { font-size: 14px; font-weight: bold; margin-bottom: 12px; color: #333; text-align: center; }
  .modal-label { font-size: 12px; color: #666; display: block; margin-bottom: 4px; }
  .modal-content textarea {
    width: 100%; height: 60px; padding: 8px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 4px;
    resize: none; margin-bottom: 12px; font-family: inherit;
    user-select: text; -webkit-user-select: text;
  }
  .modal-content input {
    width: 100%; padding: 8px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 4px;
    margin-bottom: 16px; font-family: inherit;
    user-select: text; -webkit-user-select: text;
  }
  .modal-btns { display: flex; gap: 8px; }
  .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }
  .btn-save { background: #ff8800; color: white; }
  .btn-cancel { background: #ddd; color: #333; }

  ::-webkit-scrollbar { width: 0px; display: none; }
</style>
</head>
<body>

<!-- 로딩 오버레이 -->
<div id="loadingOverlay">
  <div class="loading-title">포스기 로딩 중...</div>
  <div class="loading-sub">데이터를 불러오는 중입니다</div>
</div>

<div class="topbar">
  <div class="topbar-left">
    <button class="btn-quiz-toggle" id="quizToggle" onclick="toggleQuiz()">퀴즈 시작</button>
    <button class="btn-export-data" onclick="exportMenusToKakao()">📤 데이터 내보내기</button>
  </div>
  <span class="quiz-score" id="quizScore"></span>
</div>
<div class="quiz-prompt" id="quizPrompt">
  <span id="quizQuestion">—</span>
</div>

<div class="main">
  <div class="cat-area">
    <div class="cat-row" id="tabRow0"></div>
    <div class="cat-row" id="tabRow1"></div>
    <div class="cat-row" id="tabRow2"></div>
  </div>
  <div class="red-divider"></div>
  <div class="menu-area">
    <div class="menu-grid" id="menuGrid"></div>
  </div>
</div>

<!-- 메뉴 편집 모달 -->
<div class="edit-modal" id="editModal">
  <div class="modal-content">
    <div class="modal-title">🔧 메뉴 편집 (길게 누르기)</div>
    <label class="modal-label">메뉴 이름 (줄바꿈은 Enter 키 입력)</label>
    <textarea id="modalNameInput" placeholder="메뉴명 입력"></textarea>
    <label class="modal-label">가격 (숫자만 입력)</label>
    <input type="text" id="modalPriceInput" placeholder="가격 입력 (없으면 비우기)">
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeEditModal()">취소</button>
      <button class="modal-btn btn-save" onclick="saveEditModal()">저장</button>
    </div>
  </div>
</div>

<!-- 카테고리 편집 모달 -->
<div class="edit-modal" id="catEditModal">
  <div class="modal-content">
    <div class="modal-title">📂 상단 카테고리 편집 (길게 누르기)</div>
    <label class="modal-label">카테고리 이름 (줄바꿈은 Enter 키 입력)</label>
    <textarea id="catModalNameInput" placeholder="카테고리명 입력"></textarea>
    <div class="modal-btns">
      <button class="modal-btn btn-cancel" onclick="closeCatEditModal()">취소</button>
      <button class="modal-btn btn-save" onclick="saveCatEditModal()">저장</button>
    </div>
  </div>
</div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ============================================================
// SUPABASE 설정
// Supabase 프로젝트 생성 후 아래 값을 채워주세요.
//
// [Supabase 테이블 생성 SQL - Supabase > SQL Editor에서 실행]
// create table pos_data (
//   id integer primary key default 1,
//   tab_pages jsonb,
//   menu_data jsonb,
//   updated_at timestamptz default now()
// );
// alter table pos_data enable row level security;
// create policy "Allow all" on pos_data for all using (true) with check (true);
// ============================================================
const SUPABASE_URL = 'https://xxkqyoduesuzvhuqxvnl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4a3F5b2R1ZXN1enZodXF4dm5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5ODI2ODAsImV4cCI6MjA5NDU1ODY4MH0.0Y8kUkwPAtkRtcW7Uddi6tVgxa9uBojEjnW2t8U1tVA';

let supabaseClient = null;
if (SUPABASE_URL !== 'YOUR_SUPABASE_URL') {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
}

let isOwnUpdate = false;

// ============================================================
// STATE
// ============================================================
let TAB_PAGES = null;
let MENUS = null;
let currentCat = '식빵/파이류';
let quizMode = false;
let quizCorrect = 0;
let quizWrong = 0;
let quizTarget = null;
let menuPage = 0;
let currentPage = 0;

let activeEditIndex = null;
let activeCatPage = null;
let activeCatRow = null;
let activeCatCol = null;

// ============================================================
// 데이터 로드 (버전 비교: data.json 버전 > Supabase 버전이면 data.json 우선)
// ============================================================
async function loadData() {
  // data.json 항상 먼저 가져와서 버전 확인
  let jsonDefaults = null;
  let jsonVersion = 0;
  try {
    const res = await fetch('./data.json');
    jsonDefaults = await res.json();
    jsonVersion = jsonDefaults.data_version || 0;
  } catch (e) {}

  // 1. Supabase 시도
  if (supabaseClient) {
    try {
      const { data, error } = await supabaseClient
        .from('pos_data')
        .select('tab_pages, menu_data, data_version')
        .eq('id', 1)
        .maybeSingle();

      if (!error && data) {
        const supabaseVersion = data.data_version || 0;
        if (jsonVersion > supabaseVersion && jsonDefaults) {
          // data.json이 더 새로움 → data.json 적용 후 Supabase 업데이트
          console.log(`data.json v${jsonVersion} > Supabase v${supabaseVersion} → data.json 적용`);
          TAB_PAGES = jsonDefaults.tab_pages;
          MENUS = jsonDefaults.menu_data;
          await saveToSupabase(jsonVersion);
        } else {
          TAB_PAGES = data.tab_pages;
          MENUS = data.menu_data;
        }
        localStorage.setItem('POS_USER_TABS', JSON.stringify(TAB_PAGES));
        localStorage.setItem('POS_USER_MENUS', JSON.stringify(MENUS));
        localStorage.setItem('POS_DATA_VERSION', String(Math.max(jsonVersion, supabaseVersion)));
        return;
      }
    } catch (e) {
      console.warn('Supabase 로드 실패, 로컬 캐시 사용:', e);
    }
  }

  // 2. localStorage 캐시 사용 (버전 비교)
  const cachedVersion = parseInt(localStorage.getItem('POS_DATA_VERSION') || '0');
  const cachedTabs = localStorage.getItem('POS_USER_TABS');
  const cachedMenus = localStorage.getItem('POS_USER_MENUS');
  if (cachedTabs && cachedMenus && cachedVersion >= jsonVersion) {
    try {
      TAB_PAGES = JSON.parse(cachedTabs);
      MENUS = JSON.parse(cachedMenus);
      return;
    } catch (e) {}
  }

  // 3. data.json 기본값 로드
  if (jsonDefaults) {
    TAB_PAGES = jsonDefaults.tab_pages;
    MENUS = jsonDefaults.menu_data;
    await saveToSupabase(jsonVersion);
  }
}

// ============================================================
// 데이터 저장
// ============================================================
async function saveToSupabase(dataVersion) {
  if (!supabaseClient) return;
  const version = dataVersion !== undefined
    ? dataVersion
    : parseInt(localStorage.getItem('POS_DATA_VERSION') || '0');
  try {
    isOwnUpdate = true;
    const { error } = await supabaseClient
      .from('pos_data')
      .upsert({ id: 1, tab_pages: TAB_PAGES, menu_data: MENUS, data_version: version, updated_at: new Date().toISOString() });
    if (error) console.error('Supabase 저장 오류:', error);
    setTimeout(() => { isOwnUpdate = false; }, 1500);
  } catch (e) {
    console.error('Supabase 저장 실패:', e);
    isOwnUpdate = false;
  }
}

function setupRealtime() {
  if (!supabaseClient) return;
  supabaseClient
    .channel('pos_data_changes')
    .on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'pos_data' },
      (payload) => {
        if (isOwnUpdate) return;
        TAB_PAGES = payload.new.tab_pages;
        MENUS = payload.new.menu_data;
        localStorage.setItem('POS_USER_TABS', JSON.stringify(TAB_PAGES));
        localStorage.setItem('POS_USER_MENUS', JSON.stringify(MENUS));
        renderTabs();
        renderMenus(false);
      }
    )
    .subscribe();
}

function saveMenusToStorage() {
  localStorage.setItem('POS_USER_MENUS', JSON.stringify(MENUS));
  saveToSupabase();
}

function saveTabsToStorage() {
  localStorage.setItem('POS_USER_TABS', JSON.stringify(TAB_PAGES));
  saveToSupabase();
}

// ============================================================
// 로딩 오버레이
// ============================================================
function showLoading(show) {
  document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
}

// ============================================================
// 초기화
// ============================================================
async function init() {
  showLoading(true);
  try {
    await loadData();
  } catch (e) {
    console.error('데이터 로드 실패:', e);
    alert('데이터를 불러오지 못했습니다. 페이지를 새로고침 해주세요.');
  }
  showLoading(false);
  setupRealtime();
  renderTabs();
  renderMenus();
}

// ============================================================
// HELPERS
// ============================================================
function normCat(label) { return label ? label.replace(/\n/g, '') : label; }
function priceText(p) { return p == null ? '' : '(' + p.toLocaleString() + ')'; }
function isBlankCell(cell) {
  return cell === null || cell === undefined || (typeof cell === 'object' && ((cell.n || '') === '') && cell.p == null);
}

// ============================================================
// 데이터 내보내기
// ============================================================
function exportMenusToKakao() {
  try {
    const exportPackage = { TAB_LAYOUT: TAB_PAGES, MENU_DATA: MENUS };
    const dataStr = JSON.stringify(exportPackage, null, 2);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(dataStr).then(() => {
        alert('📤 포스기 메뉴 및 카테고리 데이터가 일괄 복사되었습니다!\n\n카카오톡을 열고 개발자님에게 [붙여넣기]해서 전송해 주세요.');
      });
    } else {
      const textArea = document.createElement('textarea');
      textArea.value = dataStr;
      textArea.style.position = 'fixed';
      document.body.appendChild(textArea);
      textArea.select();
      document.execCommand('copy');
      document.body.removeChild(textArea);
      alert('📤 포스기 메뉴 및 카테고리 데이터가 일괄 복사되었습니다!\n\n카카오톡을 열고 개발자님에게 [붙여넣기]해서 전송해 주세요.');
    }
  } catch (err) {
    alert('데이터 추출 중 오류가 발생했습니다.');
  }
}

// ============================================================
// 길게 누르기 (Long Press) 제어 엔진
// ============================================================
function setupLongPressEvent(btn, onLongPress, onSingleClick) {
  let pressTimer = null;
  let longPressed = false;

  function startPress() {
    if (quizMode) return;
    longPressed = false;
    btn.classList.add('pressing');
    pressTimer = setTimeout(() => {
      longPressed = true;
      btn.classList.remove('pressing');
      if (navigator.vibrate) navigator.vibrate(60);
      onLongPress();
    }, 600);
  }

  function cancelPress() {
    clearTimeout(pressTimer);
    pressTimer = null;
    btn.classList.remove('pressing');
  }

  btn.addEventListener('touchstart', startPress, { passive: true });
  btn.addEventListener('touchend', cancelPress);
  btn.addEventListener('touchmove', cancelPress);
  btn.addEventListener('mousedown', startPress);
  btn.addEventListener('mouseup', cancelPress);
  btn.addEventListener('mouseleave', cancelPress);
  btn.addEventListener('contextmenu', (e) => e.preventDefault());

  btn.addEventListener('click', () => {
    if (quizMode) { if (onSingleClick) onSingleClick(); return; }
    if (longPressed) { longPressed = false; return; }
    if (onSingleClick) onSingleClick();
  });
}

// ============================================================
// RENDER TABS
// ============================================================
function renderTabs() {
  for (let r = 0; r < 3; r++) {
    const rowEl = document.getElementById('tabRow' + r);
    rowEl.innerHTML = '';
    const row = TAB_PAGES[currentPage][r];

    row.forEach((label, c) => {
      if (label === '▶') {
        const btn = document.createElement('button');
        btn.className = 'cat-nav';
        btn.textContent = '▶';
        btn.onclick = () => { currentPage = 1; renderTabs(); };
        rowEl.appendChild(btn);
        return;
      }
      if (label === '◀') {
        const btn = document.createElement('button');
        btn.className = 'cat-nav';
        btn.textContent = '◀';
        btn.onclick = () => { currentPage = 0; renderTabs(); };
        rowEl.appendChild(btn);
        return;
      }
      if (label === null) {
        const btn = document.createElement('button');
        btn.className = 'cat-btn empty';
        rowEl.appendChild(btn);
        return;
      }

      const key = normCat(label);
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (currentCat === key ? ' active' : '');
      btn.innerHTML = label.replace(/\n/g, '<br>');

      setupLongPressEvent(btn,
        () => openCatEditModal(currentPage, r, c, label),
        () => {
          if (!MENUS[key]) return;
          currentCat = key;
          menuPage = 0;
          renderTabs();
          renderMenus(true);
        }
      );

      rowEl.appendChild(btn);
    });
  }
}

// ============================================================
// RENDER MENUS
// ============================================================
function renderMenus(reset = true) {
  if (reset) menuPage = 0;
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';

  const catData = MENUS[currentCat] || [];
  if (Array.isArray(catData[0])) {
    const pageData = catData[menuPage] || [];

    pageData.forEach((cell, idx) => {
      if (cell === '▶') {
        grid.appendChild(createMenuNavButton('▶', () => {
          menuPage = Math.min(menuPage + 1, catData.length - 1);
          renderMenus(false);
        }));
      } else if (cell === '◀') {
        grid.appendChild(createMenuNavButton('◀', () => {
          menuPage = Math.max(menuPage - 1, 0);
          renderMenus(false);
        }));
      } else if (isBlankCell(cell)) {
        grid.appendChild(createGenericButton(null, idx));
      } else {
        grid.appendChild(createGenericButton(cell, idx));
      }
    });

    while (grid.children.length < 30) {
      grid.appendChild(createGenericButton(null, grid.children.length));
    }
  }
}

function createMenuNavButton(label, onClick) {
  const btn = document.createElement('button');
  btn.className = 'menu-btn';
  btn.style.fontSize = '16px';
  btn.textContent = label;
  btn.onclick = onClick;
  return btn;
}

function createGenericButton(item, index) {
  const btn = document.createElement('button');
  btn.className = 'menu-btn';

  if (item) {
    btn.innerHTML = '<div>' + item.n.replace(/\n/g, '<br>') + '</div>' +
      (item.p != null ? '<div class="price">' + priceText(item.p) + '</div>' : '');
  } else {
    btn.classList.add('blank');
  }

  setupLongPressEvent(btn,
    () => openEditModal(item, index),
    () => { if (item) handleClick(item, btn); }
  );

  return btn;
}

function handleClick(item, btn) {
  if (quizMode && quizTarget) {
    const cleanItemName = item.n.replace(/[\n\s]/g, '');
    const cleanTargetName = quizTarget.replace(/[\n\s]/g, '');
    if (cleanItemName === cleanTargetName) {
      quizCorrect++;
      flash(btn, true);
      quizTarget = null;
      updateScore();
      setTimeout(nextQuiz, 450);
    } else {
      quizWrong++;
      flash(btn, false);
      updateScore();
    }
  } else {
    btn.classList.add('flash');
    setTimeout(() => btn.classList.remove('flash'), 180);
  }
}

function flash(btn, ok) {
  btn.classList.add(ok ? 'flash-correct' : 'flash-wrong');
  setTimeout(() => btn.classList.remove('flash-correct', 'flash-wrong'), 350);
}

// ============================================================
// 메뉴 편집 모달
// ============================================================
function openEditModal(item, idx) {
  if (quizMode) return;
  activeEditIndex = idx;
  document.getElementById('modalNameInput').value = item ? item.n : '';
  document.getElementById('modalPriceInput').value = item && item.p != null ? item.p : '';
  document.getElementById('editModal').classList.add('show');
  document.getElementById('modalNameInput').focus();
}

function closeEditModal() {
  document.getElementById('editModal').classList.remove('show');
  activeEditIndex = null;
}

function saveEditModal() {
  if (activeEditIndex === null) return;
  const nameVal = document.getElementById('modalNameInput').value;
  const priceVal = document.getElementById('modalPriceInput').value;
  let finalPrice = priceVal.trim() === '' || priceVal.toLowerCase() === 'null'
    ? null : parseInt(priceVal.replace(/[^0-9]/g, ''), 10);
  if (isNaN(finalPrice)) finalPrice = null;

  if (nameVal.trim() === '' && finalPrice === null) {
    MENUS[currentCat][menuPage][activeEditIndex] = null;
  } else {
    MENUS[currentCat][menuPage][activeEditIndex] = { n: nameVal, p: finalPrice };
  }

  saveMenusToStorage();
  closeEditModal();
  renderMenus(false);
}

// ============================================================
// 카테고리 편집 모달
// ============================================================
function openCatEditModal(page, row, col, currentLabel) {
  if (quizMode) return;
  activeCatPage = page; activeCatRow = row; activeCatCol = col;
  document.getElementById('catModalNameInput').value = currentLabel || '';
  document.getElementById('catEditModal').classList.add('show');
  document.getElementById('catModalNameInput').focus();
}

function closeCatEditModal() {
  document.getElementById('catEditModal').classList.remove('show');
  activeCatPage = null; activeCatRow = null; activeCatCol = null;
}

function saveCatEditModal() {
  if (activeCatPage === null || activeCatRow === null || activeCatCol === null) return;
  const oldLabel = TAB_PAGES[activeCatPage][activeCatRow][activeCatCol];
  const oldKey = normCat(oldLabel);
  const newLabel = document.getElementById('catModalNameInput').value;
  const newKey = normCat(newLabel);

  if (newLabel.trim() === '') { alert('카테고리명은 공백으로 설정할 수 없습니다.'); return; }

  TAB_PAGES[activeCatPage][activeCatRow][activeCatCol] = newLabel;
  saveTabsToStorage();

  if (oldKey !== newKey) {
    if (MENUS[oldKey]) { MENUS[newKey] = MENUS[oldKey]; delete MENUS[oldKey]; }
    else { MENUS[newKey] = [[null]]; }
    if (currentCat === oldKey) currentCat = newKey;
    saveMenusToStorage();
  }

  closeCatEditModal();
  renderTabs();
  renderMenus(true);
}

// ============================================================
// 퀴즈
// ============================================================
function allMenuItems() {
  const arr = [];
  Object.values(MENUS).forEach(cat => {
    if (Array.isArray(cat[0])) {
      cat.forEach(page => page.forEach(x => { if (x && typeof x === 'object' && x.n && x.p != null) arr.push(x); }));
    } else {
      cat.forEach(x => { if (x && typeof x === 'object' && x.n && x.p != null) arr.push(x); });
    }
  });
  return arr;
}

function toggleQuiz() {
  quizMode = !quizMode;
  const btn = document.getElementById('quizToggle');
  const prompt = document.getElementById('quizPrompt');
  if (quizMode) {
    quizCorrect = 0; quizWrong = 0;
    btn.textContent = '퀴즈 종료';
    prompt.classList.add('show');
    updateScore();
    nextQuiz();
  } else {
    btn.textContent = '퀴즈 시작';
    prompt.classList.remove('show');
    quizTarget = null;
    updateScore();
  }
  renderMenus(false);
}

function nextQuiz() {
  const items = allMenuItems();
  if (!items.length) return;
  const pick = items[Math.floor(Math.random() * items.length)];
  quizTarget = pick.n;
  document.getElementById('quizQuestion').innerHTML = '찾을 메뉴: ' + pick.n.replace(/\n/g, ' ');
}

function updateScore() {
  document.getElementById('quizScore').textContent = quizMode ? `정답 ${quizCorrect} / 오답 ${quizWrong}` : '';
}

// 시작
init();
</script>
</body>
</html>
