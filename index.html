<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>BBangWay 관리자</title>
<meta name="description" content="베이커리 빵 인식 앱 관리자">
<meta name="theme-color" content="#cc0000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BBangWay">
<link rel="manifest" href="manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  background: #f5f5f5;
  height: 100vh; height: 100dvh;
  overflow: hidden; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── Loading ── */
#loading {
  position: fixed; inset: 0; background: white; z-index: 999999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.loading-logo  { font-size: 44px; }
.loading-title { font-size: 22px; font-weight: bold; color: #cc0000; }
.loading-sub   { font-size: 13px; color: #aaa; }

/* ── Auth ── */
#authScreen {
  flex: 1; display: none; flex-direction: column; align-items: center;
  justify-content: center; padding: 28px; overflow-y: auto;
}
.auth-logo  { font-size: 52px; margin-bottom: 6px; }
.auth-title { font-size: 26px; font-weight: bold; color: #cc0000; margin-bottom: 2px; }
.auth-sub   { font-size: 13px; color: #aaa; margin-bottom: 26px; }

.auth-tabs { display: flex; width: 100%; max-width: 320px; margin-bottom: 18px; border-radius: 8px; overflow: hidden; border: 1.5px solid #e0e0e0; }
.auth-tab  { flex: 1; padding: 10px; text-align: center; font-size: 13px; font-weight: bold; cursor: pointer; background: white; color: #aaa; border: none; transition: background .15s; }
.auth-tab.active { background: #cc0000; color: white; }

.auth-form  { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 10px; }
.auth-input { padding: 13px 14px; font-size: 14px; border: 1.5px solid #ddd; border-radius: 8px; font-family: inherit; outline: none; user-select: text; -webkit-user-select: text; transition: border-color .2s; }
.auth-input:focus { border-color: #cc0000; }
.auth-error { font-size: 12px; min-height: 16px; text-align: center; }
.btn-auth   { padding: 14px; background: #cc0000; color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 2px; }
.btn-auth:active { background: #aa0000; }

/* ── Store Setup ── */
#storeSetup {
  flex: 1; display: none; flex-direction: column; align-items: center;
  justify-content: center; padding: 28px; overflow-y: auto;
}
.setup-emoji { font-size: 40px; margin-bottom: 10px; }
.setup-title { font-size: 20px; font-weight: bold; color: #333; margin-bottom: 4px; }
.setup-sub   { font-size: 13px; color: #888; margin-bottom: 24px; text-align: center; line-height: 1.6; }
.setup-form  { width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 12px; }

/* ── Common form elements ── */
.form-group    { display: flex; flex-direction: column; gap: 4px; }
.form-label    { font-size: 12px; font-weight: bold; color: #555; }
.form-label.req::after { content: ' *'; color: #cc0000; }
.form-input    { padding: 12px 13px; font-size: 14px; border: 1.5px solid #ddd; border-radius: 8px; font-family: inherit; outline: none; user-select: text; -webkit-user-select: text; background: white; transition: border-color .2s; }
.form-input:focus    { border-color: #cc0000; }
.form-textarea { padding: 12px 13px; font-size: 14px; border: 1.5px solid #ddd; border-radius: 8px; font-family: inherit; outline: none; resize: none; height: 80px; background: white; user-select: text; -webkit-user-select: text; transition: border-color .2s; }
.form-textarea:focus { border-color: #cc0000; }
.form-select   { padding: 12px 13px; font-size: 14px; border: 1.5px solid #ddd; border-radius: 8px; font-family: inherit; outline: none; background: white; -webkit-appearance: none; appearance: none; cursor: pointer; }
.form-select:focus   { border-color: #cc0000; }

.btn-primary  { width: 100%; padding: 14px; background: #cc0000; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn-primary:active  { background: #aa0000; }
.btn-secondary { width: 100%; padding: 12px; background: #f0f0f0; color: #555; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
.btn-secondary:active { background: #e0e0e0; }
.btn-danger   { padding: 12px 18px; background: white; color: #f44336; border: 1.5px solid #f44336; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
.btn-danger:active   { background: #fff0f0; }

/* ── Dashboard ── */
#dashboard { flex: 1; display: none; flex-direction: column; overflow: hidden; }

.header { background: #cc0000; color: white; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.header-left .header-title { font-size: 16px; font-weight: bold; }
.header-left .header-store { font-size: 11px; opacity: .8; margin-top: 1px; }
.btn-logout { padding: 5px 10px; background: rgba(255,255,255,.18); color: white; border: 1px solid rgba(255,255,255,.35); border-radius: 5px; font-size: 11px; cursor: pointer; }
.btn-logout:active { background: rgba(255,255,255,.3); }

/* ── Views ── */
.view { flex: 1; overflow-y: auto; display: none; padding: 12px; -webkit-overflow-scrolling: touch; }
.view.active { display: block; }

/* ── Bottom Nav ── */
.bottom-nav { background: white; border-top: 1px solid #e8e8e8; display: flex; flex-shrink: 0; }
.nav-btn { flex: 1; padding: 8px 4px 6px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; color: #bbb; font-size: 10px; font-weight: bold; }
.nav-btn.active { color: #cc0000; }
.nav-icon { font-size: 20px; line-height: 1; }

/* ── Bread List View ── */
.cat-filter { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; -webkit-overflow-scrolling: touch; }
.cat-filter::-webkit-scrollbar { display: none; }
.cat-chip { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: bold; white-space: nowrap; border: 1.5px solid #ddd; background: white; cursor: pointer; color: #888; flex-shrink: 0; }
.cat-chip.active { background: #cc0000; color: white; border-color: #cc0000; }

.bread-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding-bottom: 80px; }
.bread-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.09); cursor: pointer; }
.bread-card:active { opacity: .85; }
.bread-thumb { width: 100%; aspect-ratio: 1; background: #f0f0f0; display: flex; align-items: center; justify-content: center; font-size: 34px; color: #ddd; overflow: hidden; }
.bread-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bread-info { padding: 8px 10px 10px; }
.bread-name  { font-size: 13px; font-weight: bold; color: #222; margin-bottom: 2px; }
.bread-price { font-size: 12px; color: #cc0000; font-weight: bold; }
.bread-cat   { font-size: 10px; color: #aaa; margin-top: 2px; }

.empty-state { text-align: center; padding: 48px 20px; color: #ccc; grid-column: 1 / -1; }
.empty-icon  { font-size: 40px; margin-bottom: 8px; }
.empty-text  { font-size: 13px; line-height: 1.7; }

/* FAB */
.fab { position: fixed; bottom: calc(58px + env(safe-area-inset-bottom) + 14px); right: 16px; width: 52px; height: 52px; border-radius: 50%; background: #cc0000; color: white; border: none; font-size: 26px; cursor: pointer; box-shadow: 0 4px 14px rgba(204,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 100; line-height: 1; }
.fab:active { background: #aa0000; transform: scale(.95); }

/* ── Category View ── */
.section-header { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
.cat-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.cat-item { background: white; border-radius: 8px; padding: 11px 12px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.07); }
.cat-seq  { color: #ccc; font-size: 12px; width: 18px; text-align: center; flex-shrink: 0; }
.cat-name-text { flex: 1; font-size: 14px; font-weight: bold; color: #222; }
.cat-actions { display: flex; gap: 3px; }
.btn-icon { padding: 5px 8px; border: none; border-radius: 5px; font-size: 13px; cursor: pointer; background: #f5f5f5; color: #555; }
.btn-icon:active  { background: #e8e8e8; }
.btn-icon.red     { color: #f44336; }
.btn-icon-ph      { width: 34px; flex-shrink: 0; }

.btn-dashed { width: 100%; padding: 13px; background: white; border: 2px dashed #ddd; border-radius: 8px; font-size: 13px; color: #aaa; cursor: pointer; font-weight: bold; }
.btn-dashed:active { background: #f8f8f8; }

/* ── Store Settings View ── */
.settings-card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.settings-card-title { font-size: 11px; font-weight: bold; color: #bbb; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 14px; }
.settings-row { margin-bottom: 12px; }
.settings-row:last-child { margin-bottom: 0; }
.code-box { background: #f8f8f8; border-radius: 8px; padding: 14px; text-align: center; margin-top: 6px; }
.code-text { font-size: 24px; font-weight: bold; color: #cc0000; letter-spacing: 4px; font-family: monospace; }
.code-sub  { font-size: 11px; color: #bbb; margin-top: 4px; }

/* ── Bread Form (full-screen) ── */
#breadForm { position: fixed; inset: 0; background: #f5f5f5; z-index: 9999; display: none; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
#breadForm.show { display: flex; }
.form-head { background: #cc0000; color: white; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.form-head-title { font-size: 16px; font-weight: bold; }
.btn-close-form { padding: 5px 10px; background: rgba(255,255,255,.18); color: white; border: 1px solid rgba(255,255,255,.35); border-radius: 5px; font-size: 11px; cursor: pointer; }
.form-scroll { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; -webkit-overflow-scrolling: touch; }

/* Photo strip */
.photo-strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
.photo-strip::-webkit-scrollbar { display: none; }
.photo-wrap { position: relative; flex-shrink: 0; }
.photo-wrap img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; display: block; }
.btn-photo-rm { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; border-radius: 50%; background: #f44336; color: white; border: none; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.btn-photo-source { flex: 1; padding: 10px; background: white; border: 1.5px solid #ddd; border-radius: 8px; font-size: 13px; color: #555; cursor: pointer; }
.btn-photo-source:active { background: #f5f5f5; }
.photo-btns { display: flex; gap: 8px; margin-bottom: 10px; }

/* Glb button */
.btn-glb { width: 100%; padding: 12px; background: white; border: 1.5px solid #ddd; border-radius: 8px; font-size: 13px; color: #555; cursor: pointer; text-align: left; }
.btn-glb:active { background: #f8f8f8; }

.form-foot { padding: 10px 14px; background: white; border-top: 1px solid #eee; flex-shrink: 0; display: flex; gap: 8px; }
.btn-save   { flex: 2; padding: 13px; background: #cc0000; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn-save:active   { background: #aa0000; }
.btn-cancel { flex: 1; padding: 13px; background: #f0f0f0; color: #555; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; }
.btn-cancel:active { background: #e0e0e0; }
.btn-delete { flex: 1; padding: 13px; background: white; color: #f44336; border: 1.5px solid #f44336; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
.btn-delete:active { background: #fff0f0; }

/* ── Category Modal ── */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 99999; padding: 24px; }
.overlay.show { display: flex; }
.modal { background: white; border-radius: 12px; padding: 20px; width: 100%; max-width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.modal-title { font-size: 15px; font-weight: bold; color: #333; margin-bottom: 14px; text-align: center; }
.modal-btns  { display: flex; gap: 8px; margin-top: 14px; }
.btn-modal-ok { flex: 2; padding: 11px; background: #cc0000; color: white; border: none; border-radius: 7px; font-size: 13px; font-weight: bold; cursor: pointer; }
.btn-modal-ok:active { background: #aa0000; }
.btn-modal-cancel { flex: 1; padding: 11px; background: #f0f0f0; color: #555; border: none; border-radius: 7px; font-size: 13px; cursor: pointer; }

/* ── Toast ── */
#toast { position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.78); color: white; padding: 10px 18px; border-radius: 20px; font-size: 13px; z-index: 999999; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: nowrap; max-width: 88vw; overflow: hidden; text-overflow: ellipsis; }
#toast.show  { opacity: 1; }
#toast.error { background: rgba(244,67,54,.9); }

input[type=file] { display: none; }
::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading">
  <div class="loading-logo">🥐</div>
  <div class="loading-title">BBangWay</div>
  <div class="loading-sub">불러오는 중...</div>
</div>

<!-- Auth -->
<div id="authScreen">
  <div class="auth-logo">🥐</div>
  <div class="auth-title">BBangWay</div>
  <div class="auth-sub">베이커리 빵 인식 앱</div>
  <div class="auth-tabs">
    <button class="auth-tab active" onclick="switchAuthTab('login')">로그인</button>
    <button class="auth-tab"        onclick="switchAuthTab('signup')">회원가입</button>
  </div>
  <div class="auth-form">
    <input class="auth-input" type="email"    id="authEmail"    placeholder="이메일" autocomplete="email">
    <input class="auth-input" type="password" id="authPw"       placeholder="비밀번호" autocomplete="current-password">
    <input class="auth-input" type="password" id="authPwConfirm" placeholder="비밀번호 확인" style="display:none" autocomplete="new-password">
    <div class="auth-error" id="authError"></div>
    <button class="btn-auth" id="btnAuth" onclick="handleAuth()">로그인</button>
  </div>
</div>

<!-- Store Setup -->
<div id="storeSetup">
  <div class="setup-emoji">🏪</div>
  <div class="setup-title">가게 등록</div>
  <div class="setup-sub">BBangWay에 오신 것을 환영합니다!<br>먼저 가게 정보를 입력해주세요.</div>
  <div class="setup-form">
    <div class="form-group">
      <label class="form-label req">가게 이름</label>
      <input class="form-input" type="text" id="setupName" placeholder="예: 은영베이커리">
    </div>
    <div class="form-group">
      <label class="form-label">한줄 소개 (선택)</label>
      <textarea class="form-textarea" id="setupDesc" placeholder="가게 소개를 입력해주세요"></textarea>
    </div>
    <button class="btn-primary" onclick="createStore()">가게 만들기</button>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="header">
    <div class="header-left">
      <div class="header-title">🥐 BBangWay</div>
      <div class="header-store" id="headerStore"></div>
    </div>
    <button class="btn-logout" onclick="logout()">로그아웃</button>
  </div>

  <!-- 빵 목록 -->
  <div class="view active" id="viewBreads">
    <div class="cat-filter" id="catFilter"></div>
    <div class="bread-grid" id="breadGrid"></div>
  </div>

  <!-- 카테고리 -->
  <div class="view" id="viewCategories">
    <div class="section-header">카테고리 관리</div>
    <div class="cat-list" id="catList"></div>
    <button class="btn-dashed" onclick="openCatModal(null)">＋ 카테고리 추가</button>
  </div>

  <!-- 가게 설정 -->
  <div class="view" id="viewStore">
    <div class="settings-card">
      <div class="settings-card-title">가게 정보</div>
      <div class="settings-row form-group">
        <label class="form-label req">가게 이름</label>
        <input class="form-input" type="text" id="settingsName">
      </div>
      <div class="settings-row form-group">
        <label class="form-label">한줄 소개</label>
        <textarea class="form-textarea" id="settingsDesc"></textarea>
      </div>
      <button class="btn-primary" onclick="saveStoreSettings()">저장</button>
    </div>
    <div class="settings-card">
      <div class="settings-card-title">가게 코드</div>
      <div class="code-box">
        <div class="code-text" id="storeCode"></div>
        <div class="code-sub">손님 접속 링크에 사용됩니다 (2단계에서 활성화)</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="navBreads"      onclick="switchView('Breads')">
      <span class="nav-icon">🥐</span><span>빵 목록</span>
    </button>
    <button class="nav-btn"        id="navCategories"  onclick="switchView('Categories')">
      <span class="nav-icon">📂</span><span>카테고리</span>
    </button>
    <button class="nav-btn"        id="navStore"       onclick="switchView('Store')">
      <span class="nav-icon">⚙️</span><span>가게 설정</span>
    </button>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" onclick="openBreadForm(null)">＋</button>

<!-- Bread Form -->
<div id="breadForm">
  <div class="form-head">
    <span class="form-head-title" id="breadFormTitle">빵 추가</span>
    <button class="btn-close-form" onclick="closeBreadForm()">✕ 닫기</button>
  </div>
  <div class="form-scroll">
    <div class="form-group">
      <label class="form-label">사진</label>
      <div class="photo-btns">
        <button class="btn-photo-source" onclick="document.getElementById('photoCamera').click()">📷 카메라 촬영</button>
        <button class="btn-photo-source" onclick="document.getElementById('photoGallery').click()">🖼️ 갤러리 선택</button>
      </div>
      <div class="photo-strip" id="photoStrip"></div>
      <input type="file" id="photoCamera"  accept="image/*" capture="environment" onchange="handlePhotoInput(this.files)">
      <input type="file" id="photoGallery" accept="image/*" multiple            onchange="handlePhotoInput(this.files)">
    </div>
    <div class="form-group">
      <label class="form-label req">빵 이름</label>
      <input class="form-input" type="text" id="fieldName" placeholder="예: 단팥크림빵">
    </div>
    <div class="form-group">
      <label class="form-label">카테고리</label>
      <select class="form-select" id="fieldCat">
        <option value="">카테고리 없음</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">가격 (원)</label>
      <input class="form-input" type="number" id="fieldPrice" placeholder="예: 3500">
    </div>
    <div class="form-group">
      <label class="form-label">사장 한마디</label>
      <textarea class="form-textarea" id="fieldDesc" placeholder="이 빵에 대한 한마디를 적어주세요"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">3D 모델 (.glb)</label>
      <button class="btn-glb" id="glbBtn" onclick="document.getElementById('glbInput').click()">📦 파일 선택</button>
      <input type="file" id="glbInput" accept=".glb" onchange="handleGlbInput(this.files[0])">
    </div>
  </div>
  <div class="form-foot">
    <button class="btn-delete" id="btnDelete" style="display:none" onclick="confirmDeleteBread()">삭제</button>
    <button class="btn-cancel" onclick="closeBreadForm()">취소</button>
    <button class="btn-save"   onclick="saveBread()">저장</button>
  </div>
</div>

<!-- Category Modal -->
<div class="overlay" id="catModal">
  <div class="modal">
    <div class="modal-title" id="catModalTitle">카테고리 추가</div>
    <input class="form-input" type="text" id="catNameInput" placeholder="카테고리 이름">
    <div class="modal-btns">
      <button class="btn-modal-cancel" onclick="closeCatModal()">취소</button>
      <button class="btn-modal-ok"     onclick="saveCat()">저장</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ── STATE ──────────────────────────────────────────────────────
let currentUser  = null;
let currentStore = null;
let categories   = [];
let breads       = [];
let filterCatId  = null;

// bread form
let editingBreadId  = null;
let existingPhotos  = [];   // [{id, url}]
let deletedPhotoIds = [];
let pendingPhotos   = [];   // [{file, preview}]
let pendingGlbFile  = null;

// cat modal
let editingCatId = null;

// ── INIT ───────────────────────────────────────────────────────
async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) { currentUser = session.user; await afterLogin(); }
  else         { showScreen('auth'); }

  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && !currentUser) {
      currentUser = session.user; await afterLogin();
    }
    if (event === 'SIGNED_OUT') {
      currentUser = null; currentStore = null; categories = []; breads = [];
      showScreen('auth');
    }
  });
}

async function afterLogin() {
  await loadStore();
  if (!currentStore) { showScreen('storeSetup'); return; }
  await Promise.all([loadCategories(), loadBreads()]);
  showDashboard();
}

// ── SCREENS ────────────────────────────────────────────────────
function showScreen(name) {
  document.getElementById('loading').style.display    = 'none';
  document.getElementById('authScreen').style.display = name === 'auth'       ? 'flex' : 'none';
  document.getElementById('storeSetup').style.display = name === 'storeSetup' ? 'flex' : 'none';
  document.getElementById('dashboard').style.display  = name === 'dashboard'  ? 'flex' : 'none';
  document.getElementById('fab').style.display        = name === 'dashboard'  ? 'flex' : 'none';
}

function showDashboard() {
  document.getElementById('headerStore').textContent = currentStore.name;
  document.getElementById('settingsName').value      = currentStore.name;
  document.getElementById('settingsDesc').value      = currentStore.description || '';
  document.getElementById('storeCode').textContent   = currentStore.code;
  renderCatFilter();
  renderBreadGrid();
  showScreen('dashboard');
}

// ── AUTH ───────────────────────────────────────────────────────
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  document.querySelectorAll('.auth-tab').forEach((t, i) =>
    t.classList.toggle('active', (i === 0) === (mode === 'login'))
  );
  document.getElementById('authPwConfirm').style.display = mode === 'signup' ? '' : 'none';
  document.getElementById('btnAuth').textContent = mode === 'login' ? '로그인' : '회원가입';
  document.getElementById('authError').textContent = '';
  document.getElementById('authError').style.color = '#f44336';
}

async function handleAuth() {
  const email   = document.getElementById('authEmail').value.trim();
  const pw      = document.getElementById('authPw').value;
  const pwConfirm = document.getElementById('authPwConfirm').value;
  const errEl   = document.getElementById('authError');
  const btn     = document.getElementById('btnAuth');

  errEl.textContent = ''; errEl.style.color = '#f44336';
  if (!email || !pw) { errEl.textContent = '이메일과 비밀번호를 입력해주세요'; return; }
  if (authMode === 'signup') {
    if (pw !== pwConfirm) { errEl.textContent = '비밀번호가 일치하지 않습니다'; return; }
    if (pw.length < 6)    { errEl.textContent = '비밀번호는 6자 이상이어야 합니다'; return; }
  }

  btn.textContent = '처리 중...'; btn.disabled = true;
  try {
    let error;
    if (authMode === 'login') {
      ({ error } = await sb.auth.signInWithPassword({ email, password: pw }));
    } else {
      ({ error } = await sb.auth.signUp({ email, password: pw }));
      if (!error) {
        errEl.style.color = '#4caf50';
        errEl.textContent = '가입 완료! 이메일 인증 링크를 확인해주세요.';
      }
    }
    if (error) throw error;
  } catch (e) {
    errEl.textContent = xlateError(e.message);
  } finally {
    btn.textContent = authMode === 'login' ? '로그인' : '회원가입';
    btn.disabled = false;
  }
}

function xlateError(msg) {
  if (msg.includes('Invalid login'))      return '이메일 또는 비밀번호가 올바르지 않습니다';
  if (msg.includes('Email not confirmed')) return '이메일 인증이 필요합니다';
  if (msg.includes('already registered')) return '이미 가입된 이메일입니다';
  if (msg.includes('rate limit'))         return '잠시 후 다시 시도해주세요';
  return msg;
}

async function logout() {
  if (!confirm('로그아웃 하시겠습니까?')) return;
  await sb.auth.signOut();
}

// ── STORE ──────────────────────────────────────────────────────
async function loadStore() {
  const { data } = await sb.from('stores').select('*').eq('owner_id', currentUser.id).maybeSingle();
  currentStore = data;
}

async function createStore() {
  const name = document.getElementById('setupName').value.trim();
  if (!name) { showToast('가게 이름을 입력해주세요', 'error'); return; }
  const desc = document.getElementById('setupDesc').value.trim();
  const code = Math.random().toString(36).slice(2, 10).toUpperCase();

  const { data, error } = await sb.from('stores')
    .insert({ owner_id: currentUser.id, name, description: desc || null, code })
    .select().single();
  if (error) { showToast('저장 실패: ' + error.message, 'error'); return; }

  currentStore = data;
  await loadCategories(); await loadBreads();
  showDashboard();
  showToast('가게가 등록됐습니다 🎉');
}

async function saveStoreSettings() {
  const name = document.getElementById('settingsName').value.trim();
  if (!name) { showToast('가게 이름을 입력해주세요', 'error'); return; }
  const desc = document.getElementById('settingsDesc').value.trim();

  const { data, error } = await sb.from('stores')
    .update({ name, description: desc || null })
    .eq('id', currentStore.id).select().single();
  if (error) { showToast('저장 실패: ' + error.message, 'error'); return; }

  currentStore = data;
  document.getElementById('headerStore').textContent = currentStore.name;
  showToast('저장됐습니다 ✓');
}

// ── CATEGORIES ─────────────────────────────────────────────────
async function loadCategories() {
  const { data } = await sb.from('categories')
    .select('*').eq('store_id', currentStore.id).order('sort_order');
  categories = data || [];
}

function renderCatFilter() {
  document.getElementById('catFilter').innerHTML =
    `<button class="cat-chip ${filterCatId === null ? 'active' : ''}" onclick="setCatFilter(null)">전체</button>` +
    categories.map(c =>
      `<button class="cat-chip ${filterCatId === c.id ? 'active' : ''}" onclick="setCatFilter('${c.id}')">${c.name}</button>`
    ).join('');
}

function renderCatList() {
  const list = document.getElementById('catList');
  if (!categories.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">📂</div><div class="empty-text">카테고리가 없습니다</div></div>';
    return;
  }
  list.innerHTML = categories.map((c, i) => `
    <div class="cat-item">
      <span class="cat-seq">${i + 1}</span>
      <span class="cat-name-text">${c.name}</span>
      <div class="cat-actions">
        ${i > 0
          ? `<button class="btn-icon" onclick="moveCat('${c.id}',-1)">↑</button>`
          : `<span class="btn-icon-ph"></span>`}
        ${i < categories.length - 1
          ? `<button class="btn-icon" onclick="moveCat('${c.id}',1)">↓</button>`
          : `<span class="btn-icon-ph"></span>`}
        <button class="btn-icon" onclick="openCatModal('${c.id}')">✏️</button>
        <button class="btn-icon red" onclick="deleteCat('${c.id}')">🗑️</button>
      </div>
    </div>
  `).join('');
}

function setCatFilter(catId) {
  filterCatId = catId; renderCatFilter(); renderBreadGrid();
}

function openCatModal(catId) {
  editingCatId = catId;
  const cat = catId ? categories.find(c => c.id === catId) : null;
  document.getElementById('catModalTitle').textContent = catId ? '카테고리 수정' : '카테고리 추가';
  document.getElementById('catNameInput').value = cat ? cat.name : '';
  document.getElementById('catModal').classList.add('show');
  setTimeout(() => document.getElementById('catNameInput').focus(), 80);
}

function closeCatModal() {
  document.getElementById('catModal').classList.remove('show');
  editingCatId = null;
}

async function saveCat() {
  const name = document.getElementById('catNameInput').value.trim();
  if (!name) { showToast('카테고리 이름을 입력해주세요', 'error'); return; }

  let error;
  if (editingCatId) {
    ({ error } = await sb.from('categories').update({ name }).eq('id', editingCatId));
  } else {
    const nextOrder = categories.length ? Math.max(...categories.map(c => c.sort_order)) + 1 : 0;
    ({ error } = await sb.from('categories').insert({ store_id: currentStore.id, name, sort_order: nextOrder }));
  }
  if (error) { showToast('저장 실패: ' + error.message, 'error'); return; }

  await loadCategories();
  renderCatList(); renderCatFilter(); renderBreadGrid();
  closeCatModal();
  showToast(editingCatId ? '수정됐습니다 ✓' : '카테고리가 추가됐습니다');
}

async function deleteCat(catId) {
  const cat = categories.find(c => c.id === catId);
  if (!confirm(`"${cat.name}" 카테고리를 삭제하시겠습니까?\n이 카테고리의 빵은 카테고리 없음으로 이동됩니다.`)) return;

  const { error } = await sb.from('categories').delete().eq('id', catId);
  if (error) { showToast('삭제 실패: ' + error.message, 'error'); return; }
  if (filterCatId === catId) filterCatId = null;

  await loadCategories();
  renderCatList(); renderCatFilter(); renderBreadGrid();
  showToast('삭제됐습니다');
}

async function moveCat(catId, dir) {
  const idx  = categories.findIndex(c => c.id === catId);
  const swap = idx + dir;
  if (swap < 0 || swap >= categories.length) return;

  const a = categories[idx], b = categories[swap];
  await Promise.all([
    sb.from('categories').update({ sort_order: b.sort_order }).eq('id', a.id),
    sb.from('categories').update({ sort_order: a.sort_order }).eq('id', b.id),
  ]);
  await loadCategories();
  renderCatList(); renderCatFilter();
}

// ── BREADS ─────────────────────────────────────────────────────
async function loadBreads() {
  const { data } = await sb.from('breads')
    .select('*, bread_photos(id, photo_url)')
    .eq('store_id', currentStore.id)
    .order('created_at', { ascending: false });
  breads = data || [];
}

function renderBreadGrid() {
  const grid     = document.getElementById('breadGrid');
  const filtered = filterCatId ? breads.filter(b => b.category_id === filterCatId) : breads;

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🥐</div>
      <div class="empty-text">등록된 빵이 없습니다<br>＋ 버튼으로 추가해보세요</div>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(bread => {
    const photo   = bread.bread_photos?.[0]?.photo_url;
    const catName = categories.find(c => c.id === bread.category_id)?.name || '';
    const price   = bread.price != null ? bread.price.toLocaleString() + '원' : '';
    return `<div class="bread-card" onclick="openBreadForm('${bread.id}')">
      <div class="bread-thumb">${photo ? `<img src="${photo}" loading="lazy">` : '🥐'}</div>
      <div class="bread-info">
        <div class="bread-name">${bread.name}</div>
        ${price   ? `<div class="bread-price">${price}</div>`   : ''}
        ${catName ? `<div class="bread-cat">${catName}</div>`   : ''}
      </div>
    </div>`;
  }).join('');
}

// ── BREAD FORM ─────────────────────────────────────────────────
function openBreadForm(breadId) {
  editingBreadId  = breadId;
  pendingPhotos   = [];
  existingPhotos  = [];
  deletedPhotoIds = [];
  pendingGlbFile  = null;

  const bread = breadId ? breads.find(b => b.id === breadId) : null;

  document.getElementById('breadFormTitle').textContent  = bread ? '빵 수정' : '빵 추가';
  document.getElementById('fieldName').value             = bread ? bread.name : '';
  document.getElementById('fieldPrice').value            = bread?.price != null ? bread.price : '';
  document.getElementById('fieldDesc').value             = bread?.description || '';
  document.getElementById('glbBtn').textContent          = bread?.glb_url ? '📦 파일 변경' : '📦 파일 선택';
  document.getElementById('btnDelete').style.display     = bread ? '' : 'none';
  document.getElementById('photoCamera').value           = '';
  document.getElementById('photoGallery').value          = '';

  const defaultCat = bread ? bread.category_id : filterCatId;
  const sel = document.getElementById('fieldCat');
  sel.innerHTML = '<option value="">카테고리 없음</option>' +
    categories.map(c => `<option value="${c.id}"${defaultCat === c.id ? ' selected' : ''}>${c.name}</option>`).join('');

  if (bread?.bread_photos?.length) {
    existingPhotos = bread.bread_photos.map(p => ({ id: p.id, url: p.photo_url }));
  }

  renderPhotoStrip();
  document.getElementById('breadForm').classList.add('show');
}

function closeBreadForm() {
  document.getElementById('breadForm').classList.remove('show');
  pendingPhotos.forEach(p => URL.revokeObjectURL(p.preview));
  pendingPhotos = []; existingPhotos = []; deletedPhotoIds = [];
  editingBreadId = null; pendingGlbFile = null;
}

function handlePhotoInput(files) {
  Array.from(files).forEach(file => {
    pendingPhotos.push({ file, preview: URL.createObjectURL(file) });
  });
  renderPhotoStrip();
  document.getElementById('photoCamera').value  = '';
  document.getElementById('photoGallery').value = '';
}

function renderPhotoStrip() {
  const strip = document.getElementById('photoStrip');
  const kept  = existingPhotos.filter(p => !deletedPhotoIds.includes(p.id));
  strip.innerHTML =
    kept.map(p => `
      <div class="photo-wrap">
        <img src="${p.url}" alt="">
        <button class="btn-photo-rm" onclick="rmExistingPhoto('${p.id}')">✕</button>
      </div>`).join('') +
    pendingPhotos.map((p, i) => `
      <div class="photo-wrap">
        <img src="${p.preview}" alt="">
        <button class="btn-photo-rm" onclick="rmPendingPhoto(${i})">✕</button>
      </div>`).join('');
}

function rmExistingPhoto(photoId) { deletedPhotoIds.push(photoId); renderPhotoStrip(); }
function rmPendingPhoto(idx)      { URL.revokeObjectURL(pendingPhotos[idx].preview); pendingPhotos.splice(idx, 1); renderPhotoStrip(); }

function handleGlbInput(file) {
  if (!file) return;
  pendingGlbFile = file;
  document.getElementById('glbBtn').textContent = `📦 ${file.name}`;
}

async function saveBread() {
  const name = document.getElementById('fieldName').value.trim();
  if (!name) { showToast('빵 이름을 입력해주세요', 'error'); return; }

  const priceRaw = document.getElementById('fieldPrice').value;
  const price    = priceRaw !== '' ? parseInt(priceRaw, 10) : null;
  const desc     = document.getElementById('fieldDesc').value.trim();
  const catId    = document.getElementById('fieldCat').value || null;

  showToast('저장 중...');

  try {
    let breadId = editingBreadId;

    if (editingBreadId) {
      const { error } = await sb.from('breads')
        .update({ name, price: isNaN(price) ? null : price, description: desc || null, category_id: catId })
        .eq('id', editingBreadId);
      if (error) throw error;
    } else {
      const { data, error } = await sb.from('breads')
        .insert({ store_id: currentStore.id, name, price: isNaN(price) ? null : price, description: desc || null, category_id: catId })
        .select().single();
      if (error) throw error;
      breadId = data.id;
    }

    // 삭제된 사진 DB 제거 (스토리지 파일은 별도 정리)
    for (const photoId of deletedPhotoIds) {
      await sb.from('bread_photos').delete().eq('id', photoId);
    }

    // 신규 사진 업로드
    for (const { file } of pendingPhotos) {
      const ext  = file.name.split('.').pop().toLowerCase() || 'jpg';
      const path = `${currentStore.id}/${breadId}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error: upErr } = await sb.storage.from('bread-photos').upload(path, file);
      if (upErr) { console.warn('사진 업로드 실패:', upErr.message); continue; }
      const { data: { publicUrl } } = sb.storage.from('bread-photos').getPublicUrl(path);
      await sb.from('bread_photos').insert({ bread_id: breadId, photo_url: publicUrl });
    }

    // GLB 업로드
    if (pendingGlbFile) {
      const path = `${currentStore.id}/${breadId}/model.glb`;
      const { error: glbErr } = await sb.storage.from('bread-models').upload(path, pendingGlbFile, { upsert: true });
      if (!glbErr) {
        const { data: { publicUrl } } = sb.storage.from('bread-models').getPublicUrl(path);
        await sb.from('breads').update({ glb_url: publicUrl }).eq('id', breadId);
      }
    }

    await loadBreads();
    renderBreadGrid();
    closeBreadForm();
    showToast(editingBreadId ? '수정됐습니다 ✓' : '빵이 등록됐습니다 🥐');
  } catch (e) {
    showToast('저장 실패: ' + e.message, 'error');
  }
}

async function confirmDeleteBread() {
  const bread = breads.find(b => b.id === editingBreadId);
  if (!bread || !confirm(`"${bread.name}"을 삭제하시겠습니까?`)) return;

  const { error } = await sb.from('breads').delete().eq('id', editingBreadId);
  if (error) { showToast('삭제 실패: ' + error.message, 'error'); return; }

  await loadBreads();
  renderBreadGrid();
  closeBreadForm();
  showToast('삭제됐습니다');
}

// ── NAV ────────────────────────────────────────────────────────
function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  document.getElementById('view' + view).classList.add('active');
  document.getElementById('nav'  + view).classList.add('active');

  document.getElementById('fab').style.display = view === 'Breads' ? 'flex' : 'none';

  if (view === 'Categories') renderCatList();
}

// ── TOAST ──────────────────────────────────────────────────────
let toastTimer = null;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className   = 'show' + (type === 'error' ? ' error' : '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2400);
}

// ── START ──────────────────────────────────────────────────────
init();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {}));
}
</script>
