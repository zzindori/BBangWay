<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>은영 포스기 연습</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #c8c8c8;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    background: #f0f0f0;
    border-bottom: 2px solid #999;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 8px;
    font-size: 12px;
    color: #333;
    flex-shrink: 0;
  }
  .topbar-right { display: flex; gap: 4px; align-items: center; }
  .btn-top { padding: 3px 10px; border: 1px solid #aaa; background: #ddd; font-size: 11px; cursor: pointer; border-radius: 2px; }
  .btn-print { background: #f90; color: white; border-color: #c60; font-weight: bold; }
  .btn-minus { background: #555; color: white; border-color:#333; }
  .btn-x { background: #d00; color: white; border-color:#900; font-weight:bold; }

  .quiz-bar {
    background: #1a3a6a;
    color: white;
    padding: 5px 10px;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .quiz-score { font-weight: bold; color: #ffe; margin-left: 10px; }
  .quiz-toggle { background: #ffd700; color: #333; border: none; padding: 4px 12px; border-radius: 3px; font-size: 11px; font-weight: bold; cursor: pointer; }
  .quiz-prompt { background: #fff8dc; border-top: 2px solid #ffd700; padding: 8px 12px; font-size: 13px; font-weight: bold; color: #333; flex-shrink: 0; display: none; }
  .quiz-prompt.show { display: block; }

  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #c8c8c8; }

  /* 상단 탭 영역 */
  .cat-area { background: #d0d0d0; padding: 4px 4px 0; flex-shrink: 0; }

  /* 5열 고정 그리드 */
  .cat-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
    margin-bottom: 3px;
  }

  .cat-btn {
    padding: 5px 3px;
    border: 1px solid #bbb;
    background: #e6e6e6;
    font-size: 11px;
    cursor: pointer;
    border-radius: 2px;
    text-align: center;
    line-height: 1.3;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: keep-all;
  }
  .cat-btn.active { background: white; border: 2px solid #cc0000; font-weight: bold; }
  .cat-btn:active { background: #cce0ff; }
  .cat-btn.empty { background: #e6e6e6; border: 1px solid #bbb; cursor: default; pointer-events: none; }
  .cat-nav {
    background: #888; color: white; font-size: 16px; cursor: pointer;
    border: 1px solid #666; border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    min-height: 34px;
  }
  .cat-nav:active { background: #555; }

  .red-divider { height: 3px; background: #cc0000; margin: 0 4px 3px; flex-shrink: 0; }

  /* 메뉴 영역 */
  .menu-area { flex: 1; overflow-y: auto; padding: 3px 4px 4px; }
  .menu-grid { display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(6, 1fr); gap: 3px; height: 100%; min-height: 320px; }

  .menu-btn {
    background: white;
    border: 1px solid #c0c0c0;
    padding: 4px 3px;
    font-size: 10.5px;
    cursor: pointer;
    border-radius: 2px;
    text-align: center;
    line-height: 1.3;
    min-height: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    word-break: keep-all;
  }
  .menu-btn.blank { background: white; border: 1px solid #c0c0c0; cursor: default; pointer-events: none; }
  .menu-btn:active { background: #cce0ff; border-color: #66a; }
  .menu-btn .price { color: #555; font-size: 9px; }
  .menu-btn.flash-correct { background: #4caf50 !important; color: white; }
  .menu-btn.flash-wrong   { background: #f44336 !important; color: white; }
  .menu-btn.selected { background: #ffe0b0; border-color: #e07000; }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #aaa; border-radius: 2px; }
</style>
</head>

<!-- TOP BAR -->
<div style="background:#f0f0f0;border-bottom:2px solid #999;display:flex;align-items:center;justify-content:space-between;padding:5px 8px;flex-shrink:0;">

// ============================================================
// STATE
// ============================================================
let currentPage = 0;
let currentCat = '식빵/파이류';
let quizMode = false;
let quizCorrect = 0;
let quizWrong = 0;
let quizTarget = null;

// ============================================================
// HELPERS
// ============================================================
function normCat(label) { return label ? label.replace(/\n/g, '') : label; }
function priceText(p) { return p == null ? '' : '(' + p.toLocaleString() + ')'; }
function isBlankCell(cell) {
  return cell === null || cell === undefined || (typeof cell === 'object' && ((cell.n || '') === '') && cell.p == null);
}

// ============================================================
// RENDER TABS
// ============================================================
function renderTabs() {
  for (let r = 0; r < 3; r++) {
    const rowEl = document.getElementById('tabRow' + r);
    rowEl.innerHTML = '';
    const row = TAB_PAGES[currentPage][r];

    row.forEach(label => {
      if (label === '▶') {
        const btn = document.createElement('button');
        btn.className = 'cat-nav';
        btn.textContent = '▶';
        btn.onclick = () => { currentPage = 1; renderTabs(); };
        rowEl.appendChild(btn);
        return;
      }
      if (label === '◀') {
        const btn = document.createElement('button');
        btn.className = 'cat-nav';
        btn.textContent = '◀';
        btn.onclick = () => { currentPage = 0; renderTabs(); };
        rowEl.appendChild(btn);
        return;
      }
      if (label === null) {
        const btn = document.createElement('button');
        btn.className = 'cat-btn empty';
        btn.innerHTML = '';
        rowEl.appendChild(btn);
        return;
      }

      const key = normCat(label);
      const btn = document.createElement('button');
      btn.className = 'cat-btn' + (currentCat === key ? ' active' : '');
      btn.innerHTML = label.replace(/\n/g, '<br>');
      btn.onclick = () => {
        if (!MENUS[key]) return;
        currentCat = key;
        menuPage = 0;
        renderTabs();
        renderMenus();
      };
      rowEl.appendChild(btn);
    });
  }
}

// ============================================================
// RENDER MENUS
// ============================================================
let menuPage = 0;

function createBlankMenuButton() {
  const btn = document.createElement('button');
  btn.className = 'menu-btn blank';
  btn.innerHTML = '';
  return btn;
}

function createMenuNavButton(label, onClick) {
  const btn = document.createElement('button');
  btn.className = 'menu-btn';
  btn.style.fontSize = '16px';
  btn.textContent = label;
  btn.onclick = onClick;
  return btn;
}

function createMenuItemButton(item) {
  const btn = document.createElement('button');
  btn.className = 'menu-btn';
  btn.innerHTML = '<div>' + item.n.replace(/\n/g, '<br>') + '</div>' + (item.p != null ? '<div class="price">' + priceText(item.p) + '</div>' : '');
  btn.onclick = () => handleClick(item, btn);
  return btn;
}

function renderMenus(reset=true) {
  if (reset) menuPage = 0;
  const grid = document.getElementById('menuGrid');
  grid.innerHTML = '';

  const catData = MENUS[currentCat] || [];
  if (Array.isArray(catData[0])) {
    // 명시적 페이지 배열
    const pageData = catData[menuPage] || [];
    const totalPages = catData.length;
    
    // PDF 기준: 항상 6행 × 5열 = 30칸을 유지한다.
    const cells = pageData.slice(0, 30);
    while (cells.length < 30) cells.push(null);

    cells.forEach((cell) => {
      if (cell === '▶') {
        grid.appendChild(createMenuNavButton('▶', () => {
          menuPage = Math.min(menuPage + 1, totalPages - 1);
          renderMenus(false);
        }));
      } else if (cell === '◀') {
        grid.appendChild(createMenuNavButton('◀', () => {
          menuPage = Math.max(menuPage - 1, 0);
          renderMenus(false);
        }));
      } else if (isBlankCell(cell)) {
        grid.appendChild(createBlankMenuButton());
      } else {
        grid.appendChild(createMenuItemButton(cell));
      }
    });
  } else {
    // 단순 배열: 자동 페이징 (30칸, 빈칸 없음)
    const allItems = catData;
    const SLOTS = 30;
    const FIRST = SLOTS - 1; // 29
    const MID   = SLOTS - 2; // 28
    const total = allItems.length;
    let startIdx, endIdx, showPrev, showNext;
    if (total <= FIRST) {
      startIdx = 0; endIdx = total; showPrev = false; showNext = false;
    } else if (menuPage === 0) {
      startIdx = 0; endIdx = FIRST; showPrev = false; showNext = true;
    } else {
      startIdx = FIRST + (menuPage-1) * MID;
      const rem = total - startIdx;
      if (rem > MID) { endIdx = startIdx + MID; showPrev = true; showNext = true; }
      else { endIdx = total; showPrev = true; showNext = false; }
    }

    // 자동 페이징 카테고리도 PDF 기준 6행 × 5열 = 30칸을 반드시 유지한다.
    // 예: 크리스마스처럼 메뉴가 29개인 경우 마지막 1칸도 빈 버튼으로 채운다.
    const cells = [];
    if (showPrev) cells.push('◀');
    allItems.slice(startIdx, endIdx).forEach(item => cells.push(item));
    if (showNext) cells.push('▶');
    while (cells.length < SLOTS) cells.push(null);

    cells.slice(0, SLOTS).forEach(cell => {
      if (cell === '▶') {
        grid.appendChild(createMenuNavButton('▶', () => { menuPage++; renderMenus(false); }));
      } else if (cell === '◀') {
        grid.appendChild(createMenuNavButton('◀', () => { menuPage--; renderMenus(false); }));
      } else if (isBlankCell(cell)) {
        grid.appendChild(createBlankMenuButton());
      } else {
        grid.appendChild(createMenuItemButton(cell));
      }
    });
  }
}

function handleClick(item, btn) {
  if (quizMode && quizTarget) {
    if (item.n === quizTarget) {
      quizCorrect++;
      flash(btn, true);
      quizTarget = null;
      updateScore();
      setTimeout(nextQuiz, 450);
    } else {
      quizWrong++;
      flash(btn, false);
      updateScore();
    }
  } else {
    btn.classList.toggle('selected');
  }
}

function flash(btn, ok) {
  btn.classList.add(ok ? 'flash-correct' : 'flash-wrong');
  setTimeout(() => btn.classList.remove('flash-correct','flash-wrong'), 350);
}

// ============================================================
// QUIZ
// ============================================================
function allMenuItems() {
  const arr = [];
  Object.values(MENUS).forEach(cat => {
    if (Array.isArray(cat[0])) {
      cat.forEach(page => page.forEach(x => { if (x && typeof x === 'object' && x.n && x.p != null) arr.push(x); }));
    } else {
      cat.forEach(x => { if (x && typeof x === 'object' && x.n && x.p != null) arr.push(x); });
    }
  });
  return arr;
}

function toggleQuiz() {
  quizMode = !quizMode;
  const btn = document.getElementById('quizToggle');
  const prompt = document.getElementById('quizPrompt');
  if (quizMode) {
    quizCorrect = 0; quizWrong = 0;
    btn.textContent = '퀴즈 종료';
    prompt.classList.add('show');
    updateScore();
    nextQuiz();
  } else {
    btn.textContent = '퀴즈 시작';
    prompt.classList.remove('show');
    quizTarget = null;
    updateScore();
  }
}

function nextQuiz() {
  const items = allMenuItems();
  if (!items.length) return;
  const pick = items[Math.floor(Math.random() * items.length)];
  quizTarget = pick.n;
  document.getElementById('quizQuestion').innerHTML = '찾을 메뉴: ' + pick.n.replace(/\n/g, ' ');
}

function updateScore() {
  const score = document.getElementById('quizScore');
  score.textContent = quizMode ? `정답 ${quizCorrect} / 오답 ${quizWrong}` : '';
}

// INIT
renderTabs();
renderMenus();
