  <!-- 빵 몸통 -->
  <ellipse cx="256" cy="285" rx="145" ry="88" fill="#f5c469"/>
  <!-- 빵 윗면 -->
  <ellipse cx="256" cy="236" rx="145" ry="98" fill="#e8a83a"/>
